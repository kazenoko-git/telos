# Typos configuration — exclude ML/research terms and generated files.
# See: https://github.com/crate-ci/typos

[default.extend-words]
# ML terms that look like typos
corosred = "corosred"
mdlm = "mdlm"
undlm = "undlm"
afm = "afm"
unk = "unk"
bos = "bos"
eos = "eos"
cls = "cls"
sep = "sep"
ND = "ND"
nd = "nd"
pLDDT = "pLDDT"
fpr = "fpr"
IST = "IST"
multipl = "multipl"
writeable = "writeable"
arange = "arange"

[files]
extend-exclude = [
    "*.json",
    "*.jsonl",
    "*.lock",
    "*.bin",
    "*.ipynb",
    "checkpoints/",
    "dist/",
    "evals/",
    "logs/",
    "research/",
    "scratch/",
    "data/",
    "reports/",
    "figures/",
]
