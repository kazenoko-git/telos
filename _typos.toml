# Typos configuration — exclude ML/research terms and generated files.
# See: https://github.com/crate-ci/typos

[default.extend-words]
# ML terms that look like typos
corosred = "corosred"
mdlm = "mdlm"
undlm = "undlm"
afm = "afm"
unk = "unk"
bos = "bos"
eos = "eos"
cls = "cls"
sep = "sep"
ND = "ND"
nd = "nd"
pLDDT = "pLDDT"

[files]
extend-exclude = [
    "*.json",
    "*.lock",
    "checkpoints/",
    "dist/",
    "evals/",
]
