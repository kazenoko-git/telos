<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light">
<title>{{TITLE}} · Télos</title>
<style>{{STYLE}}</style>
</head>
<body>
<header><a class="brand" href="#top" aria-label="Télos evaluation home"><img src="data:image/png;base64,{{LOGO}}" alt="Télos"><span>Evaluation</span></a><nav aria-label="Report actions"><button id="download">Export JSON</button><button id="print">Print report ↗</button></nav></header>
<main id="top">
<section class="intro"><div class="title-line"><h1>{{TITLE}}</h1><span class="pill">Saved evaluation</span></div><p id="note" class="lede"></p><p id="source" class="source"></p></section>
<section id="metrics" class="metrics" aria-label="Evaluation summary"></section>
<div class="analysis-grid"><section class="panel"><div class="section-heading"><div><h2>Category results</h2></div><span id="chart-label" class="muted">Correct / evaluated</span></div><div id="categories" class="bars"></div></section>
<section class="panel assurance"><h2>Verification</h2><div id="checks"></div><p class="fine">Replay and offset checks do not measure answer correctness.</p></section></div>
<section class="explorer"><div class="section-heading"><div><h2>Cases</h2></div><button id="csv">Export visible CSV ↓</button></div>
<div class="filters"><label class="search">Find a case<input id="search" aria-label="Find a case" type="search" placeholder="Question, category, model, result…"></label><label>Model<select id="model" aria-label="Model"><option value="">All models</option></select></label><label>Suite<select id="suite" aria-label="Suite"><option value="">All suites</option></select></label><label>Outcome<select id="outcome" aria-label="Outcome"><option value="">All outcomes</option><option value="failed">Incorrect</option><option value="passed">Correct</option><option value="unknown">Unscored / errors</option></select></label><label>Category<select id="category" aria-label="Category"><option value="">All categories</option></select></label><button id="reset">Reset</button></div>
<div class="table-caption"><span id="count" aria-live="polite"></span></div>
<div class="table-wrap"><table><thead><tr><th scope="col">Case / question</th><th scope="col">Category</th><th scope="col">Result</th><th scope="col">Confidence</th><th scope="col">Client time</th></tr></thead><tbody id="rows"></tbody></table></div><p id="empty" hidden>No matching cases.</p>
<p id="summary-only" hidden>Suite summaries only; task records unavailable.</p></section>

</main>
<dialog id="detail" aria-labelledby="detail-title"><div class="dialog-head"><span class="eyebrow" id="detail-id"></span><button id="close" aria-label="Close case details">Close ×</button></div><h2 id="detail-title"></h2><div id="detail-content"></div></dialog>
<script id="report-data" type="application/json">{{DATA}}</script>
<script>{{SCRIPT}}</script>
</body></html>
