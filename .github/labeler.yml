# Labeler configuration for actions/labeler@v5
# Maps labels to glob patterns of changed files.

area/models:
  - changed-files:
      - any-glob-to-any-file: "telos/models/**"

area/training:
  - changed-files:
      - any-glob-to-any-file: "telos/training/**"

area/diffusion:
  - changed-files:
      - any-glob-to-any-file: "telos/diffusion/**"

area/decoding:
  - changed-files:
      - any-glob-to-any-file: "telos/decoding/**"

area/afm:
  - changed-files:
      - any-glob-to-any-file: "telos/afm/**"

area/bench:
  - changed-files:
      - any-glob-to-any-file: "telos/bench/**"

area/testing:
  - changed-files:
      - any-glob-to-any-file: "telos/testing/**"

tests:
  - changed-files:
      - any-glob-to-any-file: "tests/**"

docs:
  - changed-files:
      - any-glob-to-any-file:
          - "*.md"
          - "docs/**"

ci:
  - changed-files:
      - any-glob-to-any-file: ".github/**"
