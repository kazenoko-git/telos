name: Release

on:
  push:
    tags:
      - "v*"
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build distributions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Check tag matches package version
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python - <<'PYCODE'
          import os, re
          from pathlib import Path
          version = re.search(r'^version = "([^"]+)"', Path('pyproject.toml').read_text(), re.M)[1]
          assert os.environ['RELEASE_TAG'] == f'v{version}', 'tag/package version mismatch'
          PYCODE
          python scripts/release_notes.py "$RELEASE_TAG" > /tmp/release-notes.md

      - name: Build sdist and wheel
        run: uv build

      - name: Check the wheel is self-contained
        run: |
          python -m zipfile -l dist/*.whl
          # The bundled tokenizer must ship; compiled artifacts must not.
          python - <<'PY'
          import glob, zipfile
          names = zipfile.ZipFile(glob.glob("dist/*.whl")[0]).namelist()
          assert "telos/assets/tokenizer_0.json" in names, "bundled tokenizer missing"
          assert not any(n.endswith("/afm_bridge") for n in names), "compiled bridge leaked"
          assert any(n.endswith("afm_bridge.swift") for n in names), "bridge source missing"
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish-pypi:
    name: Publish to PyPI
    if: (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) || github.event_name == 'workflow_dispatch'
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish package to PyPI via Trusted Publishing
        uses: pypa/gh-action-pypi-publish@release/v1

  publish-github:
    name: Publish GitHub release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [build, publish-pypi]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Publish release notes and distributions
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python scripts/release_notes.py "$RELEASE_TAG" > /tmp/release-notes.md
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release edit "$RELEASE_TAG" --draft=false --title "Télos $RELEASE_TAG" --notes-file /tmp/release-notes.md --latest
            gh release upload "$RELEASE_TAG" dist/* --clobber
          else
            gh release create "$RELEASE_TAG" dist/* --verify-tag --title "Télos $RELEASE_TAG" --notes-file /tmp/release-notes.md --latest
          fi
