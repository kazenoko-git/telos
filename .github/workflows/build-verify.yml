name: Build Verify

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: build-verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Wheel smoke test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - uses: astral-sh/setup-uv@v5

      - name: Build wheel
        run: uv build

      - name: Install from built wheel
        run: pip install dist/*.whl

      - name: Smoke test imports
        run: |
          python -c "import telos; print(f'telos {telos.__version__} OK')"
          python -c "from telos import TelosConfig; print('TelosConfig OK')"
          python -c "from telos import HardwareProfile; print('HardwareProfile OK')"
