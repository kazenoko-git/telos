# Phase B — 25M Parameter Model 1:15 Ratio (375M Tokens) MLX Training Config
# Architecture: 25M Parameters (d_model=512, n_layers=8, n_heads=8, seq_len=512)
# Token Budget: 375,000,000 tokens (2,861 steps with effective batch size 256)

model:
  vocab_size: 8192
  d_model: 512
  n_layers: 8
  n_heads: 8
  n_kv_heads: 8
  seq_len: 512

training:
  batch_size: 32
  gradient_accumulation: 8  # Effective batch = 256 sequences (131,072 tokens/step)
  max_steps: 2861          # 2,861 steps * 131,072 tokens/step = 374,997,000 tokens (~375M tokens)
  max_lr: 3e-4
  min_lr: 3e-5
  warmup_steps: 150
  weight_decay: 0.1
  precision: bf16

checkpoint:
  dir: checkpoints/phase_b_25m_1to15_mlx
  save_every_steps: 500
