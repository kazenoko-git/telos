# Phase B — Lean & Hyper-Overtrained Pure Python Autocomplete Model
# Model: Deep & Narrow + GQA (~80.2M params, 16 layers, d=672)
# Token Budget: 8.0 Billion Python tokens (Hyper-overtrained 100:1 ratio beyond Chinchilla)
# Runtime: ~3.7 Hours on Kaggle TPU v5e-8 ($0 cost)

model:
  vocab_size: 8192          # 8,192 vocab for Phase B
  d_model: 672              # Lean hidden dimension (~80.2M params)
  n_layers: 16              # 16 deep layers for high-speed hierarchical reasoning
  n_heads: 12               # 12 Query attention heads
  n_kv_heads: 2             # 2 Key/Value heads (Grouped-Query Attention GQA)
  seq_len: 512
  dropout: 0.0              # No dropout for large-scale hyper-overtraining
  mlp_type: swiglu
  tied_embeddings: true
  no_timestep_embed: true

training:
  batch_size: 128
  gradient_accumulation: 2  # Effective batch = 256 sequences (131,072 tokens/step)
  max_steps: 60000          # 60,000 steps (~3.7 hours wall-clock time on TPU v5e-8)
  max_lr: 3e-4
  min_lr: 2e-5
  warmup_steps: 1000
  weight_decay: 0.1
  grad_clip: 1.0
  precision: bf16
  device: tpu

data:
  corpus_size_tokens: 8000000000 # 8.0 Billion tokens (The Stack v2 Python deduplicated)
  num_epochs: 1

checkpoint:
  dir: checkpoints/phase_b
  save_every_minutes: 20   # Periodic save every 20 min
  save_every_steps: 5000
  keep_last_n: 5

eval:
  val_every_steps: 1000
  sample_every_steps: 5000
