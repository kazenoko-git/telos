# Phase C — Flagship 1.5B Multi-Domain Code & Tool Model (~1.52B Params, 100B Tokens)
# Architecture: Deep & Narrow 26-Layer GQA (~1.52B params, 26 layers, d=2304, 32.7k vocab)
# Multi-Domain Mixture:
#   1. Python Code (~60%)
#   2. English Technical Reasoning & Instructions (~25%)
#   3. UNIX / Windows Shell Commands & CLI Tools (git, bash, docker, powershell) (~15%)
# Chinchilla Analysis:
#   - Standard Chinchilla Optimal (20:1 ratio): 30.0 Billion tokens
#   - Extreme Overtraining (66:1 ratio): 100.0 Billion tokens (3.3x beyond Chinchilla!)
# Runtime: ~3.7 Hours on TPU v6e-1 / Google TPU (~5.9 credits total)

model:
  vocab_size: 32768         # 32,768 expanded vocab for Python + English + UNIX/Windows shell
  d_model: 2304             # 2,304 hidden dimension (1.52B params)
  n_layers: 26              # 26 deep layers for high-level architectural reasoning
  n_heads: 36               # 36 Query attention heads
  n_kv_heads: 9             # 9 Key/Value heads (Grouped-Query Attention GQA 4:1)
  seq_len: 512
  dropout: 0.0              # No dropout for large-scale overtraining
  mlp_type: swiglu
  tied_embeddings: true
  no_timestep_embed: true

training:
  batch_size: 128
  gradient_accumulation: 2  # Effective batch = 256 sequences (131,072 tokens/step)
  max_steps: 600000         # 600,000 steps (~3.7 hours wall-clock time on TPU v6e-1)
  max_lr: 3e-4
  min_lr: 1.5e-5
  warmup_steps: 5000
  weight_decay: 0.1
  grad_clip: 1.0
  precision: bf16
  device: tpu

data:
  corpus_size_tokens: 100000000000 # 100.0 Billion multi-domain tokens
  mixture:
    python_code: 0.60
    english_instructions: 0.25
    shell_commands: 0.15
  num_epochs: 1

checkpoint:
  dir: checkpoints/phase_c
  save_every_minutes: 5    # Periodic save every 5 min for spot safety
  save_every_steps: 5000
  keep_last_n: 10

eval:
  val_every_steps: 5000
  sample_every_steps: 10000
