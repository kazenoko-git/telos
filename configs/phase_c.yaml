# Phase C — 1.0B Multi-Domain Flagship Model (~1.08B Params, 40B Tokens)
# Architecture: Deep & Narrow 24-Layer GQA (~1.08B params, 24 layers, d=2048, 32.7k vocab)
# Multi-Domain Mixture:
#   1. Python Code (~60%)
#   2. English Technical Reasoning & Instructions (~25%)
#   3. UNIX / Windows Shell Commands & CLI Tools (git, bash, docker, powershell) (~15%)
# Credit Efficiency: ~2.0 Credits total on TPU v6e-1 (~1 hr 15 mins wall-clock time)

model:
  vocab_size: 32768         # 32,768 expanded vocab for Python + English + UNIX/Windows shell
  d_model: 2048             # 2,048 hidden dimension (1.08B params)
  n_layers: 24              # 24 deep layers for multi-domain reasoning & tool execution
  n_heads: 32               # 32 Query attention heads
  n_kv_heads: 8             # 8 Key/Value heads (Grouped-Query Attention GQA 4:1)
  seq_len: 512
  dropout: 0.0              # No dropout for large-scale overtraining
  mlp_type: swiglu
  tied_embeddings: true
  no_timestep_embed: true

training:
  batch_size: 128
  gradient_accumulation: 2  # Effective batch = 256 sequences (131,072 tokens/step)
  max_steps: 250000         # 250,000 steps (~1 hour 15 minutes wall-clock time on TPU v6e-1)
  max_lr: 3e-4
  min_lr: 1.5e-5
  warmup_steps: 3000
  weight_decay: 0.1
  grad_clip: 1.0
  precision: bf16
  device: tpu

data:
  corpus_size_tokens: 40000000000 # 40.0 Billion multi-domain tokens
  mixture:
    python_code: 0.60
    english_instructions: 0.25
    shell_commands: 0.15
  num_epochs: 1

checkpoint:
  dir: checkpoints/phase_c
  save_every_minutes: 5    # Periodic save every 5 min for spot safety
  save_every_steps: 5000
  keep_last_n: 10

eval:
  val_every_steps: 5000
  sample_every_steps: 10000
