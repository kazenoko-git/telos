# télos Unified 3-Paradigm Config: 12.5M Model, 1:25 Ratio (~313.5M tokens)
# Architecture: 12.5M Parameters (d_model=256, n_layers=13, n_heads=4, n_kv_heads=4, seq_len=512)

model:
  vocab_size: 8192
  d_model: 256
  n_layers: 13
  n_heads: 4
  n_kv_heads: 4
  seq_len: 512

training:
  total_tokens: 313524224    # ~313.5M tokens (1:25 ratio)
  max_lr: 4e-4
  min_lr: 4e-5
  warmup_ratio: 0.04
  weight_decay: 0.1
  precision: bf16

  # Device-specific hardware execution profiles
  tpu:
    batch_size: 32
    gradient_accumulation: 1
    num_devices: 8
  mac:
    batch_size: 32
    gradient_accumulation: 8
    num_devices: 1
  gpu:
    batch_size: 32
    gradient_accumulation: 8
    num_devices: 1

checkpoint:
  dir: checkpoints/12m/telos_12m_r25
  save_every_steps: 400
