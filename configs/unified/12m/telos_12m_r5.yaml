# télos Unified 3-Paradigm Config: 12.5M Model, 1:5 Ratio (~62.7M tokens)
# Architecture: 12.5M Parameters (d_model=256, n_layers=13, n_heads=4, n_kv_heads=4, seq_len=512)

model:
  vocab_size: 8192
  d_model: 256
  n_layers: 13
  n_heads: 4
  n_kv_heads: 4
  seq_len: 512

training:
  batch_size: 32
  gradient_accumulation: 8  # Effective batch = 256 sequences (131,072 tokens/step)
  max_steps: 478           # 478 steps * 131,072 = 62,652,416 tokens (~62.7M tokens)
  max_lr: 4e-4
  min_lr: 4e-5
  warmup_steps: 50
  weight_decay: 0.1
  precision: bf16

checkpoint:
  dir: checkpoints/12m/telos_12m_r5
  save_every_steps: 100
