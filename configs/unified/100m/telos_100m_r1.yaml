# télos Unified 3-Paradigm Config: 100M Model, 1:1 Ratio (~105M tokens)
# Architecture: ~105M Parameters (d_model=768, n_layers=14, n_heads=12, n_kv_heads=12, seq_len=512)

model:
  vocab_size: 8192
  d_model: 768
  n_layers: 14
  n_heads: 12
  n_kv_heads: 12
  seq_len: 512

training:
  total_tokens: 105000000     # ~105M tokens (1:1 ratio)
  max_lr: 6e-4
  min_lr: 6e-5
  warmup_ratio: 0.05
  weight_decay: 0.01
  precision: bf16
  gradient_checkpointing: true

  # Device-specific hardware execution profiles
  tpu:
    batch_size: 32
    gradient_accumulation: 1
    num_devices: 8
  mac:
    batch_size: 8
    gradient_accumulation: 16
    num_devices: 1
  gpu:
    batch_size: 16
    gradient_accumulation: 8
    num_devices: 1
  lightning:
    batch_size: 16
    gradient_accumulation: 4
    num_devices: 1

checkpoint:
  dir: checkpoints/100m/telos_100m_r1
  save_every_steps: 150
