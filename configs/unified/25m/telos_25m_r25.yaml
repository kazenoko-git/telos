# télos Unified 3-Paradigm Config: 25M Model, 1:25 Ratio (~653.8M tokens)
# Architecture: 25M Parameters (d_model=384, n_layers=13, n_heads=6, n_kv_heads=6, seq_len=512)

model:
  vocab_size: 8192
  d_model: 384
  n_layers: 13
  n_heads: 6
  n_kv_heads: 6
  seq_len: 512

training:
  total_tokens: 653721600    # ~653.7M tokens (1:25 ratio)
  max_lr: 1e-3
  min_lr: 1e-4
  warmup_ratio: 0.05
  weight_decay: 0.01
  precision: bf16
  gradient_checkpointing: true

  # Device-specific hardware execution profiles
  tpu:
    batch_size: 48
    gradient_accumulation: 1
    num_devices: 8
  mac:
    batch_size: 32
    gradient_accumulation: 8
    num_devices: 1
  gpu:
    batch_size: 32
    gradient_accumulation: 8
    num_devices: 1
  lightning:
    batch_size: 64
    gradient_accumulation: 2
    num_devices: 1

checkpoint:
  dir: checkpoints/25m/telos_25m_r25
  save_every_steps: 150
