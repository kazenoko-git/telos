# télos Unified 3-Paradigm Config: 25M Model, 1:25 Ratio (~653.8M tokens)
# Architecture: 25M Parameters (d_model=384, n_layers=13, n_heads=6, n_kv_heads=6, seq_len=512)

model:
  vocab_size: 8192
  d_model: 384
  n_layers: 13
  n_heads: 6
  n_kv_heads: 6
  seq_len: 512

training:
  batch_size: 128
  gradient_accumulation: 16  # 128 * 16 * 512 = 1,048,576 tokens/step
  max_steps: 624             # 624 * 1,048,576 = 654,311,424 tokens (~654.3M tokens)
  max_lr: 1e-4               # Fine-tuning / zero-shock upscaling learning rate
  min_lr: 1e-5
  warmup_steps: 50
  weight_decay: 0.1
  precision: bf16

checkpoint:
  dir: checkpoints/25m/telos_25m_r25
  save_every_steps: 50
