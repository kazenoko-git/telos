# télos Unified 3-Paradigm Config: 25M Model, 1:1 Ratio (~25M tokens)
# Architecture: 25M Parameters (d_model=512, n_layers=8, n_heads=8, n_kv_heads=8, seq_len=512)

model:
  vocab_size: 8192
  d_model: 512
  n_layers: 8
  n_heads: 8
  n_kv_heads: 8
  seq_len: 512

training:
  batch_size: 32
  gradient_accumulation: 8  # Effective batch = 256 sequences (131,072 tokens/step)
  max_steps: 191           # 191 steps * 131,072 = 25,034,752 tokens (~25M tokens)
  max_lr: 3e-4
  min_lr: 3e-5
  warmup_steps: 20
  weight_decay: 0.1
  precision: bf16

checkpoint:
  dir: checkpoints/25m/telos_25m_r1
  save_every_steps: 50
