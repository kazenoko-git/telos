# télos Unified 3-Paradigm Config: 25M Model, 1:1 Ratio (~26.2M tokens)
# Architecture: 25M Parameters (d_model=384, n_layers=13, n_heads=6, n_kv_heads=6, seq_len=512)

model:
  vocab_size: 8192
  d_model: 384
  n_layers: 13
  n_heads: 6
  n_kv_heads: 6
  seq_len: 512

training:
  batch_size: 64             # Empirically measured optimal TPU throughput sweet spot (141k tok/s)
  gradient_accumulation: 16  # 64 * 16 * 512 = 524,288 tokens/step
  max_steps: 50              # 50 * 524,288 = 26,214,400 tokens (~26.2M tokens)
  max_lr: 1e-4               # Fine-tuning / zero-shock upscaling learning rate
  min_lr: 1e-5
  warmup_steps: 10
  weight_decay: 0.1
  precision: bf16

checkpoint:
  dir: checkpoints/25m/telos_25m_r1
  save_every_steps: 25
