# télos Unified 3-Paradigm Config: 25M Model, 1:10 Ratio (~261.6M tokens)
# Architecture: 25M Parameters (d_model=384, n_layers=13, n_heads=6, n_kv_heads=6, seq_len=512)

model:
  vocab_size: 8192
  d_model: 384
  n_layers: 13
  n_heads: 6
  n_kv_heads: 6
  seq_len: 512

training:
  batch_size: 48
  gradient_accumulation: 2  # 48 * 2 * 8 * 512 = 393,216 tokens/step (on 8 cores)
  max_steps: 665            # 665 * 393,216 tokens/step
  max_lr: 1e-4               # Fine-tuning / zero-shock upscaling learning rate
  min_lr: 1e-5
  warmup_steps: 50
  weight_decay: 0.1
  precision: bf16

checkpoint:
  dir: checkpoints/25m/telos_25m_r10
  save_every_steps: 100
