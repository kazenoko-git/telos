# télos Unified 3-Paradigm Config: 25M Model, 1:20 Ratio (~500M tokens)
# Architecture: 25M Parameters (d_model=512, n_layers=8, n_heads=8, n_kv_heads=8, seq_len=512)

model:
  vocab_size: 8192
  d_model: 512
  n_layers: 8
  n_heads: 8
  n_kv_heads: 8
  seq_len: 512

training:
  batch_size: 32
  gradient_accumulation: 16  # Effective batch = 512 sequences (262,144 tokens/step)
  max_steps: 1908            # 1908 steps * 262,144 = 500,170,752 tokens (~500M tokens)
  max_lr: 1e-4              # Fine-tuning / upscaling learning rate to preserve pretrained representations
  min_lr: 1e-5
  warmup_steps: 100
  weight_decay: 0.1
  precision: bf16

checkpoint:
  dir: checkpoints/25m/telos_25m_r20
  save_every_steps: 300
