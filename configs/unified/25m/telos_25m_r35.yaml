# télos Unified 3-Paradigm Config: 25M Model, 1:35 Ratio (~875M tokens)
# Architecture: 25M Parameters (d_model=512, n_layers=8, n_heads=8, n_kv_heads=8, seq_len=512)

model:
  vocab_size: 8192
  d_model: 512
  n_layers: 8
  n_heads: 8
  n_kv_heads: 8
  seq_len: 512

training:
  batch_size: 32
  gradient_accumulation: 8  # Effective batch = 256 sequences (131,072 tokens/step)
  max_steps: 6685          # 6685 steps * 131,072 = 876,216,320 tokens (~875M tokens)
  max_lr: 3e-4
  min_lr: 3e-5
  warmup_steps: 300
  weight_decay: 0.1
  precision: bf16

checkpoint:
  dir: checkpoints/25m/telos_25m_r35
  save_every_steps: 500
