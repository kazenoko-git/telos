# télos Unified 3-Paradigm Config: 25M Model, 1:35 Ratio (~915.1M tokens)
# Architecture: 25M Parameters (d_model=384, n_layers=13, n_heads=6, n_kv_heads=6, seq_len=512)

model:
  vocab_size: 8192
  d_model: 384
  n_layers: 13
  n_heads: 6
  n_kv_heads: 6
  seq_len: 512

training:
  batch_size: 32
  gradient_accumulation: 16  # Effective batch = 512 sequences (262,144 tokens/step)
  max_steps: 3491            # 3491 steps * 262,144 = 915,144,704 tokens (~915.1M tokens)
  max_lr: 1e-4               # Fine-tuning / zero-shock upscaling learning rate
  min_lr: 1e-5
  warmup_steps: 100
  weight_decay: 0.1
  precision: bf16

checkpoint:
  dir: checkpoints/25m/telos_25m_r35
  save_every_steps: 300
