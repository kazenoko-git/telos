# télos Unified 3-Paradigm Config: 25M Model, 1:15 Ratio (~392.2M tokens)
# Architecture: 25M Parameters (d_model=384, n_layers=13, n_heads=6, n_kv_heads=6, seq_len=512)

model:
  vocab_size: 8192
  d_model: 384
  n_layers: 13
  n_heads: 6
  n_kv_heads: 6
  seq_len: 512

training:
  batch_size: 48
  gradient_accumulation: 1  # 48 * 1 * 8 * 512 = 196,608 tokens/step (on 8 cores)
  max_steps: 1995            # 1995 * 196,608 tokens/step
  max_lr: 1e-4               # Fine-tuning / zero-shock upscaling learning rate
  min_lr: 1e-5
  warmup_steps: 75
  weight_decay: 0.1
  precision: bf16

checkpoint:
  dir: checkpoints/25m/telos_25m_r15
  save_every_steps: 100
