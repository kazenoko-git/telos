model:
  vocab_size: 8192
  d_model: 512
  n_layers: 8
  n_heads: 8
  n_kv_heads: 4
  seq_len: 256
  tied_embeddings: true
  mask_token_id: 0
training:
  batch_size: 16
  gradient_accumulation: 2
  max_steps: 5000
  warmup_steps: 100
  max_lr: 3.0e-4
  min_lr: 3.0e-5
  weight_decay: 0.1
corosred:
  phase: "B"
  mask_prob: 0.15
checkpoint:
  checkpoint_dir: "checkpoints/corosred/phase_b_denoise"
  save_every_steps: 1000
