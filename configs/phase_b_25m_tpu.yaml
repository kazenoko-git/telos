# télos Phase B — 25M Parameter Model (Google TPU v6e-1)
# Architecture: ~25.3M params, 6 layers, d=512, 8 n_heads, 2 n_kv_heads (GQA 4:1)
# Token Budget: 500 Million Python Code tokens (Chinchilla-Optimal 20:1 ratio)
# Effective Batch Size: 1024 (524,288 tokens/step)
# Expected Training Time: ~1.5 Minutes on Google TPU v6e-1 (5.74M tok/s)

model:
  vocab_size: 8192          # 8,192 BPE tokens for Python code
  d_model: 512              # 512 hidden dimension (25.3M params)
  n_layers: 6               # 6 transformer layers
  n_heads: 8                # 8 Query attention heads
  n_kv_heads: 2             # 2 Key/Value heads (Grouped-Query Attention 4:1)
  seq_len: 512              # 512 sequence length
  dropout: 0.0
  mlp_type: swiglu
  tied_embeddings: true
  no_timestep_embed: true

training:
  batch_size: 512           # Micro-batch size 512 on TPU v6e-1
  gradient_accumulation: 2  # Effective batch = 1024 (524,288 tokens/step)
  max_steps: 954            # 500,000,000 / 524,288 tokens = 954 steps
  max_lr: 1e-3              # Linear LR scaling for eff_batch=1024
  min_lr: 5e-5
  warmup_steps: 50
  weight_decay: 0.1
  grad_clip: 1.0
  timestep_schedule: beta   # Beta(1.5, 1.5) importance sampling
  device: xla
  precision: bfloat16

data:
  corpus_size_tokens: 500000000

checkpoint:
  dir: checkpoints/phase_b_25m_tpu
  save_every_steps: 200
  save_every_minutes: 1
