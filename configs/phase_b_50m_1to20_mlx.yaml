# Phase B — 50M Model 1:20 Ratio (1.0B Tokens) Local MLX Config
model:
  vocab_size: 8192
  d_model: 768
  n_layers: 8
  n_heads: 12
  n_kv_heads: 12
  seq_len: 512

training:
  tokenizer_path: configs/tokenizer_mac.json
  dataset_path: data/python_corpus_mac.bin
  vocab_size: 8192
  seq_len: 512
  batch_size: 16
  gradient_accumulation: 16  # Effective batch = 256 sequences (131,072 tokens/step)
  max_steps: 3814          # 3,814 steps * 131,072 tokens/step = 500M delta tokens (~3.8 Hours)
  max_lr: 3e-4
  min_lr: 3e-5
  warmup_steps: 300
  weight_decay: 0.1

checkpoint:
  checkpoint_dir: checkpoints/phase_b_50m_1to20_mlx
  save_every_steps: 500
