# télos Phase B — 25M Parameter Model (Apple MLX Framework)
# Architecture: ~25.2M params, 6 layers, d=512, 8 n_heads, 2 n_kv_heads (GQA 4:1)
# Token Budget: 500 Million Python Code tokens (Chinchilla-Optimal 20:1 ratio)
# Expected Training Time: ~35 Minutes on Apple Silicon M5 Pro

model:
  vocab_size: 8192          # 8,192 BPE tokens for Python code
  d_model: 512              # 512 hidden dimension (25.2M params)
  n_layers: 6               # 6 transformer layers
  n_heads: 8                # 8 Query attention heads
  n_kv_heads: 2             # 2 Key/Value heads (Grouped-Query Attention 4:1)
  seq_len: 512              # 512 sequence length
  dropout: 0.0
  mlp_type: swiglu
  tied_embeddings: true
  no_timestep_embed: true

training:
  batch_size: 16            # Micro-batch size 16 (142,941 tok/sec max throughput)
  gradient_accumulation: 2  # Effective batch = 32 sequences (16,384 tokens/step)
  max_steps: 30517          # 500,000,000 / 16,384 tokens = 30,517 steps
  max_lr: 8e-4
  min_lr: 3e-5
  warmup_steps: 500
  weight_decay: 0.1
  grad_clip: 1.0
  timestep_schedule: beta   # Beta(1.5, 1.5) importance sampling

checkpoint:
  dir: checkpoints/phase_b_25m_mlx
  save_every_steps: 1000
  save_every_minutes: 10
