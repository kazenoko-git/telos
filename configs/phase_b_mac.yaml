# Phase B-Mac — Overnight 85M Model Training for Apple Silicon M5 Pro
# Architecture: Deep & Narrow (~85.4M params, 12 layers, d=768, 8.1k vocab)
# Token Budget: 500 Million Python tokens (~2.0 GB raw text)
# Runtime: ~7.5 Hours continuous overnight training on Apple Silicon M5 Pro (MPS)

model:
  vocab_size: 8192          # 8,192 BPE tokens for Python code
  d_model: 768              # 768 hidden dimension (85.4M params)
  n_layers: 12              # 12 deep layers for high quality
  n_heads: 12               # 12 Query attention heads
  n_kv_heads: 3             # 3 Key/Value heads (Grouped-Query Attention GQA 4:1)
  seq_len: 512
  dropout: 0.0
  mlp_type: swiglu
  tied_embeddings: true
  no_timestep_embed: true

training:
  batch_size: 32
  gradient_accumulation: 2  # Effective batch = 64 sequences (32,768 tokens/step)
  max_steps: 15000          # 15,000 steps (~7.5 hours continuous overnight training)
  max_lr: 4e-4
  min_lr: 2e-5
  warmup_steps: 500
  weight_decay: 0.1
  grad_clip: 1.0
  precision: bf16
  device: mps

data:
  corpus_size_tokens: 500000000 # 500 Million tokens (~2.0 GB text)
  num_epochs: 1

checkpoint:
  dir: checkpoints/phase_b_mac
  save_every_minutes: 10
  save_every_steps: 1000
  keep_last_n: 15

eval:
  val_every_steps: 1000
  sample_every_steps: 2500
