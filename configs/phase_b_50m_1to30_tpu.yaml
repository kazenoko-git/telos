# Phase B — 50M Parameter Model 1:30 Ratio (1.5B Tokens) TPU v6e-1 Training Config
# Architecture: 50M Parameters (d_model=768, n_layers=8, n_heads=12, seq_len=512)
# Token Budget: 1,500,000,000 tokens (2,861 steps with effective batch size 1024)

global:
  tokenizer_path: configs/tokenizer_mac.json
  dataset_path: data/python_corpus_mac.bin
  vocab_size: 8192
  seq_len: 512
  batch_size: 64
  gradient_accumulation: 16  # Effective batch = 1,024 sequences (524,288 tokens/step)
  max_steps: 2861            # 2,861 steps * 524,288 tokens/step = 1,500,000,000 tokens (~1.5B tokens)
  max_lr: 3e-4
  min_lr: 3e-5
  warmup_steps: 150
  weight_decay: 0.1
  precision: bf16
  checkpoint_dir: checkpoints/phase_b_50m_1to30_tpu
  save_every_steps: 500

models:
  50M:
    d_model: 768
    n_layers: 8
    n_heads: 12
