# Phase B — 25M Parameter Model 1:45 Ratio (1.125B Tokens) MLX Training Config
# Architecture: 25M Parameters (d_model=512, n_layers=8, n_heads=8, seq_len=512)
# Token Budget: 1,125,000,000 tokens (8,584 steps with effective batch size 256)

model:
  vocab_size: 8192
  d_model: 512
  n_layers: 8
  n_heads: 8
  n_kv_heads: 8
  seq_len: 512

training:
  batch_size: 16
  gradient_accumulation: 16  # Effective batch = 256 sequences (131,072 tokens/step)
  max_steps: 8584          # 8,584 steps * 131,072 tokens/step = 1,125,122,048 tokens (~1.125B tokens)
  max_lr: 3e-4
  min_lr: 3e-5
  warmup_steps: 300
  weight_decay: 0.1
  precision: bf16

checkpoint:
  dir: checkpoints/masked/25m/kappa_25m_1to45_mlx
  save_every_steps: 500
