# Phase B — 12.5M Parameter Model 1:25 Ratio (313.5M Tokens) MLX Training Config
# Architecture: 12.5M Parameters (d_model=256, n_layers=13, n_heads=4, seq_len=512)
# Token Budget: 313,516,800 tokens (2,391 steps with effective batch size 256)

model:
  vocab_size: 8192
  d_model: 256
  n_layers: 13
  n_heads: 4
  n_kv_heads: 4
  seq_len: 512

training:
  batch_size: 32
  gradient_accumulation: 8  # Effective batch = 256 sequences (131,072 tokens/step)
  max_steps: 2391          # 2391 steps * 131,072 tokens/step = 313,393,152 tokens (~313.5M tokens)
  max_lr: 4e-4
  min_lr: 4e-5
  warmup_steps: 100
  weight_decay: 0.1
  precision: bf16

checkpoint:
  dir: checkpoints/masked/12m/kappa_12m_1to25_mlx
  save_every_steps: 500
