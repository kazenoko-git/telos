# Phase B — Flagship 232M Pure Python Autocomplete Model (Lightning AI TPU v6e-1 / GPU)
# Model: Deep & Narrow + GQA (~232.4M params, 16 layers, d=1152)
# Token Budget: 8.0 Billion Python tokens (Overtrained 34:1 ratio beyond Chinchilla)
# File Size: 32.0 GB raw text (Lightning AI 100GB+ SSD disk safe)
# Runtime: ~12.5 Minutes on TPU v6e-1 (~0.33 credits total)

model:
  vocab_size: 8192          # 8,192 vocab for Phase B
  d_model: 1152             # 1,152 hidden dimension (232.4M params)
  n_layers: 16              # 16 deep layers for high-capacity code completion
  n_heads: 16               # 16 Query attention heads
  n_kv_heads: 4             # 4 Key/Value heads (Grouped-Query Attention GQA)
  seq_len: 512
  dropout: 0.0              # No dropout for large-scale overtraining
  mlp_type: swiglu
  tied_embeddings: true
  no_timestep_embed: true

training:
  batch_size: 64
  gradient_accumulation: 4  # Effective batch = 256 sequences (131,072 tokens/step)
  max_steps: 60000          # 60,000 steps (8.0 Billion tokens, 34:1 to 50:1 overtraining ratio)
  max_lr: 3e-4
  min_lr: 2e-5
  warmup_steps: 1000
  weight_decay: 0.01
  grad_clip: 1.0
  precision: bf16
  device: tpu

data:
  corpus_size_tokens: 8000000000 # 8.0 Billion tokens (32 GB text)
  num_epochs: 1

checkpoint:
  dir: checkpoints/phase_b
  save_every_minutes: 3    # Frequent save every 3 min for spot safety
  save_every_steps: 2000   # Checkpoint every 2,000 steps
  keep_last_n: 10

eval:
  val_every_steps: 2000
  sample_every_steps: 5000
