# Phase B — 12.5M Parameter Model 1:1 Ratio (12.5M Tokens) MLX Training Config
# Architecture: 12.5M Parameters (d_model=256, n_layers=13, n_heads=4, seq_len=512)
# Token Budget: 12,540,672 tokens (96 steps with effective batch size 256)

model:
  vocab_size: 8192
  d_model: 256
  n_layers: 13
  n_heads: 4
  n_kv_heads: 4
  seq_len: 512

training:
  batch_size: 32
  gradient_accumulation: 8  # Effective batch = 256 sequences (131,072 tokens/step)
  max_steps: 96            # 96 steps * 131,072 tokens/step = 12,582,912 tokens (~12.5M tokens)
  max_lr: 4e-4
  min_lr: 4e-5
  warmup_steps: 15
  weight_decay: 0.1
  precision: bf16

checkpoint:
  dir: checkpoints/masked/12m/kappa_12m_1to1_mlx
  save_every_steps: 25
