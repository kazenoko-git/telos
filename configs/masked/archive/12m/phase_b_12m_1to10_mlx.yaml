# Phase B — 12.5M Parameter Model 1:10 Ratio (125.4M Tokens) MLX Training Config
# Architecture: 12.5M Parameters (d_model=256, n_layers=13, n_heads=4, seq_len=512)
# Token Budget: 125,406,720 tokens (956 steps with effective batch size 256)

model:
  vocab_size: 8192
  d_model: 256
  n_layers: 13
  n_heads: 4
  n_kv_heads: 4
  seq_len: 512

training:
  batch_size: 32
  gradient_accumulation: 8  # Effective batch = 256 sequences (131,072 tokens/step)
  max_steps: 956           # 956 steps * 131,072 tokens/step = 125,304,832 tokens (~125.4M tokens)
  max_lr: 4e-4
  min_lr: 4e-5
  warmup_steps: 100
  weight_decay: 0.01
  precision: bf16

checkpoint:
  dir: checkpoints/masked/12m/kappa_12m_1to10_mlx
  save_every_steps: 200
