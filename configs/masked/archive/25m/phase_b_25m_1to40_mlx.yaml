# Phase B — 25M Parameter Model 1:40 Ratio (1.0B Tokens) MLX Training Config
# Architecture: 25M Parameters (d_model=512, n_layers=8, n_heads=8, seq_len=512)
# Token Budget: 1,000,000,000 tokens (7,630 steps with effective batch size 256)

model:
  vocab_size: 8192
  d_model: 512
  n_layers: 8
  n_heads: 8
  n_kv_heads: 8
  seq_len: 512

training:
  batch_size: 16
  gradient_accumulation: 16  # Effective batch = 256 sequences (131,072 tokens/step)
  max_steps: 7630          # 7,630 steps * 131,072 tokens/step = 1,000,079,360 tokens (~1.0B tokens)
  max_lr: 3e-4
  min_lr: 3e-5
  warmup_steps: 300
  weight_decay: 0.01
  precision: bf16

checkpoint:
  dir: checkpoints/masked/25m/kappa_25m_1to40_mlx
  save_every_steps: 500
