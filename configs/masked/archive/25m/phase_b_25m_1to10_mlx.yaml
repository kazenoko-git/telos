# Phase B — 25M Parameter Model 1:10 Ratio (250M Tokens) MLX Training Config
# Architecture: 25M Parameters (d_model=512, n_layers=8, n_heads=8, seq_len=512)
# Token Budget: 250,000,000 tokens (1,907 steps with effective batch size 256)

model:
  vocab_size: 8192
  d_model: 512
  n_layers: 8
  n_heads: 8
  n_kv_heads: 8
  seq_len: 512

training:
  batch_size: 32
  gradient_accumulation: 8  # Effective batch = 256 sequences (131,072 tokens/step)
  max_steps: 1907          # 1,907 steps * 131,072 tokens/step = 249,954,304 tokens (~250M tokens)
  max_lr: 3e-4
  min_lr: 3e-5
  warmup_steps: 100
  weight_decay: 0.01
  precision: bf16

checkpoint:
  dir: checkpoints/masked/25m/kappa_25m_1to10_mlx
  save_every_steps: 500
