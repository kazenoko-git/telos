# Phase B — 25M Parameter Model 1:1 Ratio (25M Tokens) MLX Training Config
# Architecture: 25M Parameters (d_model=512, n_layers=8, n_heads=8, seq_len=512)
# Token Budget: 25,000,000 tokens (191 steps with effective batch size 256)

model:
  vocab_size: 8192
  d_model: 512
  n_layers: 8
  n_heads: 8
  n_kv_heads: 8
  seq_len: 512

training:
  batch_size: 32
  gradient_accumulation: 8  # Effective batch = 256 sequences (131,072 tokens/step)
  max_steps: 191           # 191 steps * 131,072 tokens/step = 25,034,752 tokens (~25M tokens)
  max_lr: 3e-4
  min_lr: 3e-5
  warmup_steps: 20
  weight_decay: 0.01
  precision: bf16

checkpoint:
  dir: checkpoints/masked/25m/kappa_25m_1to1_mlx
  save_every_steps: 50
