# Phase B — 50M Parameter Model 1:40 Ratio (2.00B Tokens) Local MLX Config
# Trained from scratch (Beta 1.5, 1.5)
model:
  vocab_size: 8192
  d_model: 768
  n_layers: 8
  n_heads: 12
  n_kv_heads: 12
  seq_len: 512

training:
  tokenizer_path: configs/tokenizer_mac.json
  dataset_path: data/python_corpus_mac.bin
  vocab_size: 8192
  seq_len: 512
  batch_size: 16
  gradient_accumulation: 16  # Effective batch = 256 sequences (131,072 tokens/step)
  max_steps: 15257         # 15,257 steps * 131,072 tokens/step = 2.00B tokens
  max_lr: 3e-4
  min_lr: 3e-5
  warmup_steps: 300
  weight_decay: 0.01
  precision: bf16

checkpoint:
  checkpoint_dir: checkpoints/masked/50m/kappa_50m_1to40_mlx
  save_every_steps: 1000

