# Phase B — 50M Model 1:1 Ratio (50M Tokens) Local MLX Config
model:
  vocab_size: 8192
  d_model: 768
  n_layers: 8
  n_heads: 12
  n_kv_heads: 12
  seq_len: 512

training:
  tokenizer_path: configs/tokenizer_mac.json
  dataset_path: data/python_corpus_mac.bin
  vocab_size: 8192
  seq_len: 512
  batch_size: 32
  gradient_accumulation: 8  # Effective batch = 256 sequences (131,072 tokens/step)
  max_steps: 381
  max_lr: 3e-4
  min_lr: 3e-5
  warmup_steps: 50
  weight_decay: 0.01

checkpoint:
  checkpoint_dir: checkpoints/masked/50m/kappa_50m_1to1_mlx
  save_every_steps: 100
