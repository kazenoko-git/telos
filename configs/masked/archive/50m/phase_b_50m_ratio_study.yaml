# Phase B — 50M Parameter Overtraining Ratio Study (Kaggle 2x T4 / TPU)
# Evaluates 5 ratios (1:1, 1:10, 1:20, 1:30, 1:40) with dedicated per-run Cosine LR decays

model:
  vocab_size: 8192
  d_model: 512
  n_layers: 10
  n_heads: 8
  seq_len: 512
  dropout: 0.0
  mlp_type: swiglu
  tied_embeddings: true
  no_timestep_embed: true

training:
  batch_size: 16
  gradient_accumulation: 32  # Effective batch = 512 sequences (262,144 tokens/step)
  max_lr: 4e-4
  min_lr: 4e-5
  weight_decay: 0.01
  grad_clip: 1.0
  precision: bf16
  device: cuda

data:
  dataset_path: data/python_corpus_1.7b.bin
  tokenizer_path: configs/tokenizer_mac.json

ratios:
  "1:1":
    tokens: 50000000          # 50M tokens
    max_steps: 191
    warmup_steps: 20
  "1:10":
    tokens: 500000000         # 500M tokens
    max_steps: 1907
    warmup_steps: 100
  "1:20":
    tokens: 1000000000        # 1.0B tokens
    max_steps: 3814
    warmup_steps: 150
  "1:30":
    tokens: 1500000000        # 1.5B tokens
    max_steps: 5722
    warmup_steps: 200
  "1:40":
    tokens: 2000000000        # 2.0B tokens
    max_steps: 7629
    warmup_steps: 250

checkpoint:
  dir: checkpoints/masked/50m/kappa_50m_ratio_study
  save_every_steps: 1000
  keep_last_n: 3
