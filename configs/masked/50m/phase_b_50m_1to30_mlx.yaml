model:
  vocab_size: 8192
  d_model: 768
  n_layers: 8
  n_heads: 12
  n_kv_heads: 12
  seq_len: 512

training:
  tokenizer_path: configs/tokenizer_mac.json
  dataset_path: data/python_corpus_mac.bin
  vocab_size: 8192
  seq_len: 512
  batch_size: 16
  gradient_accumulation: 16
  max_steps: 1907 # 250M delta tokens
  max_lr: 3e-4
  min_lr: 3e-5
  warmup_steps: 300
  weight_decay: 0.1

checkpoint:
  checkpoint_dir: checkpoints/masked/50m/kappa_50m_1to30_mlx
  save_every_steps: 500
