# Phase B — 50M Model 1:1 Ratio (50M Tokens) Local MLX Config
global:
  tokenizer_path: configs/tokenizer_mac.json
  dataset_path: data/python_corpus_mac.bin
  vocab_size: 8192
  seq_len: 512
  batch_size: 256
  max_steps: 381
  max_lr: 3e-4
  min_lr: 3e-5
  warmup_steps: 50
  weight_decay: 0.1
  precision: bf16
  checkpoint_dir: checkpoints/phase_b_50m_1to1_mlx
  save_every_steps: 100

model:
  d_model: 768
  n_layers: 8
  n_heads: 12
