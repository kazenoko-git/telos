# télos Phase B — 85M Parameter Model (Apple MLX Framework)
# Architecture: ~85.4M params, 12 layers, d=768, 12 n_heads, 3 n_kv_heads (GQA 4:1)
# Token Budget: 500 Million Python Code tokens (Chinchilla-Optimal 20:1 ratio)
# Runtime: ~6.5 Hours continuous run on Apple Silicon M5 Pro

model:
  vocab_size: 8192          # 8,192 BPE tokens for Python code
  d_model: 768              # 768 hidden dimension (85.4M params)
  n_layers: 12              # 12 deep transformer layers
  n_heads: 12               # 12 Query attention heads
  n_kv_heads: 3             # 3 Key/Value heads (Grouped-Query Attention 4:1)
  seq_len: 512              # 512 sequence length
  dropout: 0.0
  mlp_type: swiglu
  tied_embeddings: true
  no_timestep_embed: true

training:
  batch_size: 4             # Micro-batch size 4
  gradient_accumulation: 2  # Effective batch = 8 sequences (4,096 tokens/step)
  max_steps: 15258          # 500,000,000 / 32,768 tokens = 15,258 steps
  max_lr: 4e-4
  min_lr: 2e-5
  warmup_steps: 500
  weight_decay: 0.1
  grad_clip: 1.0
  timestep_schedule: beta   # Beta(1.5, 1.5) importance sampling

checkpoint:
  dir: checkpoints/phase_b_85m_mlx
  save_every_steps: 1000
  save_every_minutes: 10
