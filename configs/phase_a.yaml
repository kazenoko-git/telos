# Phase A — 1-Hour Extended Local Run on M5 Pro (12.5M Params, 120M Tokens)

model:
  vocab_size: 4096          # 4,096 vocab size
  d_model: 320              # 320 hidden dimension
  n_layers: 10              # 10 deep layers for enhanced function logic & variable scope tracking
  n_heads: 8                # 8 Query attention heads
  n_kv_heads: 2             # 2 Key/Value heads (Grouped-Query Attention GQA)
  seq_len: 256
  dropout: 0.05
  mlp_type: swiglu
  tied_embeddings: true
  no_timestep_embed: true

training:
  batch_size: 32
  max_steps: 25000          # 25,000 steps (~60 minutes wall-clock time on M5 Pro MPS)
  max_lr: 4e-4
  min_lr: 3e-5
  warmup_steps: 500
  weight_decay: 0.1
  grad_clip: 1.0
  precision: bf16
  device: auto

data:
  corpus_size_tokens: 120000000 # 120 Million tokens streamed from online Python dataset (~480 MB text)
  train_split: 0.95
  val_split: 0.025
  test_split: 0.025

checkpoint:
  save_every_steps: 2500
  save_every_minutes: 10
  keep_last_n: 5

eval:
  val_every_steps: 1000
  sample_every_steps: 2500
  sample_prompts:
    - "def add(a, b):\n    \"\"\"Add two numbers.\"\"\"\n    return"
    - "def fibonacci(n):\n    \"\"\"Return nth Fibonacci number.\"\"\"\n"
    - "for i in range(10):\n    print("