# Phase A — Local validation on M5 Pro MacBook Pro (Deep & Narrow + GQA)

model:
  vocab_size: 4096          # 4,096 vocab for Phase A
  d_model: 112              # Deep & Narrow hidden dimension
  n_layers: 8               # Deep 8 layers for superior hierarchical reasoning
  n_heads: 4                # 4 Query attention heads
  n_kv_heads: 2             # 2 Key/Value heads (Grouped-Query Attention GQA)
  seq_len: 256
  dropout: 0.1
  mlp_type: swiglu
  tied_embeddings: true
  no_timestep_embed: true

training:
  batch_size: 32
  max_steps: 5000
  max_lr: 3e-4
  min_lr: 3e-5
  warmup_steps: 100
  weight_decay: 0.1
  grad_clip: 1.0
  precision: bf16
  device: auto

data:
  corpus_size_tokens: 30000000
  train_split: 0.95
  val_split: 0.025
  test_split: 0.025

checkpoint:
  save_every_steps: 500
  save_every_minutes: 5
  keep_last_n: 3

eval:
  val_every_steps: 250
  sample_every_steps: 500
  sample_prompts:
    - "def add(a, b):\n    \"\"\"Add two numbers.\"\"\"\n    return"
    - "def fibonacci(n):\n    \"\"\"Return nth Fibonacci number.\"\"\"\n"
    - "for i in range(10):\n    print("