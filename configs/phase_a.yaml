model:
  vocab_size: 4096
  d_model: 128
  n_layers: 6
  n_heads: 4
  seq_len: 256
  dropout: 0.1
  mlp_type: swiglu
  tied_embeddings: true
  no_timestep_embed: true

training:
  batch_size: 32
  max_steps: 5000
  max_lr: 3e-4
  min_lr: 3e-5
  warmup_steps: 100
  weight_decay: 0.1
  grad_clip: 100
  precision: bf16
  device: auto

data:
  corpus_size_tokens: 30000000
  train_split: 0.95
  val_split: 0.025
  test_split: 0.025

checkpoint:
  save_every_steps: 500
  save_every_minutes: 5
  keep_last_n: 3

eval:
  val_every_steps: 250
  sample_every_steps: 500
  sample_prompts:
    - "def add(a, b):\n    \"\"\"Add two numbers.\"\"\"\n    return"
    - "def fibonacci(n):\n    \"\"\"Return nth Fibonacci number.\"\"\"\n"
    - "for i in range(10):\n    print("