# Phase B — 25M Parameter Model 1:20 Ratio (500M Tokens) MLX Training Config
# Architecture: 25M Parameters (d_model=512, n_layers=8, n_heads=8, seq_len=512)
# Token Budget: 500,000,000 tokens (3,814 steps with effective batch size 256)

model:
  vocab_size: 8192
  d_model: 512
  n_layers: 8
  n_heads: 8
  n_kv_heads: 8
  seq_len: 512

training:
  batch_size: 32
  gradient_accumulation: 8  # Effective batch = 256 sequences (131,072 tokens/step)
  max_steps: 3814          # 3,814 steps * 131,072 tokens/step = 499,908,608 tokens (~500M tokens)
  max_lr: 3e-4
  min_lr: 3e-5
  warmup_steps: 200
  weight_decay: 0.1
  precision: bf16

checkpoint:
  dir: checkpoints/phase_b_25m_1to20_mlx
  save_every_steps: 500
