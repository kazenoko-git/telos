[project]
name = "telos-ml"
version = "1.0.0"
description = "Discrete diffusion and autoregressive language modeling: data preparation, training on MLX/CUDA/TPU, evaluation, and Python access to Apple's on-device Foundation Models."
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "Ivan Samuel" },
]
license = "Apache-2.0"
license-files = ["LICENSE"]
keywords = [
    "discrete-diffusion",
    "masked-diffusion",
    "language-model",
    "autoregressive",
    "code-completion",
    "mlx",
    "cuda",
    "tpu",
    "apple-foundation-models",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "torch>=2.5.0",
    "tokenizers>=0.21.0",
    "datasets>=3.0.0",
    "pyyaml>=6.0.0",
    "tqdm>=4.66.0",
    "numpy>=1.26.0",
    "safetensors>=0.4.0",
    "huggingface-hub>=0.25.0",
]

[project.urls]
Homepage = "https://telos.research.wingit.tech"
Repository = "https://github.com/kazenoko-git/telos"
Issues = "https://github.com/kazenoko-git/telos/issues"
Documentation = "https://github.com/kazenoko-git/telos/blob/main/DEPLOYMENT.md"
Changelog = "https://github.com/kazenoko-git/telos/blob/main/CHANGELOG.md"

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.8.0",
    "gradio>=5.0.0",
    "matplotlib>=3.8.0",
]
mlx = [
    "mlx>=0.22.0; sys_platform == 'darwin' and platform_machine == 'arm64'",
]
all = [
    "telos-ml[dev,mlx]",
]

[project.scripts]
telos = "telos.cli:main"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["telos"]
exclude = [
    "**/__pycache__",
    "**/*.pyc",
    "**/.DS_Store",
    # The compiled Swift AFM bridge is a per-machine build artifact. Only the
    # .swift source ships; the binary is compiled on first use into a cache dir.
    "**/afm_bridge",
]

[tool.hatch.build.targets.wheel.force-include]
"telos/assets/tokenizer_0.json" = "telos/assets/tokenizer_0.json"

[tool.hatch.build.targets.sdist]
only-include = [
    "telos",
    "README.md",
    "LICENSE",
    "CHANGELOG.md",
    "DEPLOYMENT.md",
]
exclude = [
    "**/__pycache__",
    "**/*.pyc",
    "**/afm_bridge",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
