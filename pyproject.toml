[project]
name = "telos"
version = "0.1.0"
description = "Small Masked Diffusion Language Model for Code Autocomplete"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.5.0",
    "tokenizers>=0.21.0",
    "datasets>=3.0.0",
    "pyyaml>=6.0.0",
    "tqdm>=4.66.0",
    "numpy>=2.0.0",
    "safetensors>=0.4.0",
    "huggingface-hub>=0.25.0",
    "pytest>=9.1.1",
    "gradio>=6.22.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.8.0",
    "gradio>=5.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["telos"]
